server:
  port: 8080

spring:
  application:
    name: api-manager

  cloud:
    gateway:
      # RF-15: CORS solo para el origen del frontend
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "https://ticket-films-frontend.vercel.app"
              - "http://localhost:5173" # dev local del frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # RF-13: solo se exponen las rutas necesarias hacia los microservicios
      routes:
        - id: cartelera-route
          uri: ${CARTELERA_URL:http://172.31.46.157:8081}
          predicates:
            - Path=/api/cartelera/**

        - id: asientos-route
          uri: ${ASIENTOS_URL:http://172.31.46.157:8082}
          predicates:
            - Path=/api/asientos/**

        - id: boletos-route
          uri: ${BOLETOS_URL:http://172.31.46.157:8083}
          predicates:
            - Path=/api/boletos/**

        # API de administración de Kafka (ms-notificaciones). El gateway exige
        # el grupo admin antes de reenviar; ms-notificaciones valida de nuevo.
        - id: notificaciones-admin-route
          uri: ${NOTIFICACIONES_URL:http://172.31.46.157:8084}
          predicates:
            - Path=/api/admin/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

cognito:
  client-id: ${COGNITO_CLIENT_ID}
  issuer-uri: ${COGNITO_ISSUER_URI}

# Grupo de Cognito que puede usar /api/admin/** (lo lee SecurityConfig)
app:
  admin:
    group: admin

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: INFO
    com.ticketfilms.api_manager: DEBUG
