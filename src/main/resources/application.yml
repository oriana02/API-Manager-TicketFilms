server:
  port: 8080

spring:
  application:
    name: api-manager

  cloud:
    gateway:
      # RF-15: CORS solo para el origen del frontend
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "https://ticket-films-frontend.vercel.app"
              - "http://localhost:5173" # dev local del frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # RF-13: solo se exponen las rutas necesarias hacia los 3 microservicios
      routes:
        - id: cartelera-route
          uri: http://ms-cartelera:8081
          predicates:
            - Path=/api/cartelera/**
          filters:
            - StripPrefix=1

        - id: asientos-route
          uri: http://ms-asientos:8082
          predicates:
            - Path=/api/asientos/**
          filters:
            - StripPrefix=1

        - id: boletos-route
          uri: http://ms-boletos:8083
          predicates:
            - Path=/api/boletos/**
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

cognito:
  client-id: ${COGNITO_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: INFO
    com.ticketfilms.api_manager: DEBUG
