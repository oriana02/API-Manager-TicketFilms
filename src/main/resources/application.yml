server:
  port: 8080

spring:
  application:
    name: api-manager

  cloud:
    gateway:
      # RF-15: CORS solo para el origen del frontend
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "https://ticket-films-frontend.vercel.app"
              - "http://localhost:5173" # dev local del frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # RF-13: solo se exponen las rutas necesarias hacia los microservicios
      routes:
        # Versionado de cartelera: 1.0.0 (8095) y 1.1.0 (8096); sin header
        # va a la version vigente (8081). El orden garantiza que primero se
        # evaluen las rutas con header y luego la ruta por defecto.
        - id: cartelera-v1-route
          order: 4
          uri: ${CARTELERA_V1_URL:http://172.31.46.157:8095}
          predicates:
            - Path=/api/cartelera/**
            - Header=X-App-Version, 1\.0\.0

        - id: cartelera-v2-route
          order: 5
          uri: ${CARTELERA_V2_URL:http://172.31.46.157:8096}
          predicates:
            - Path=/api/cartelera/**
            - Header=X-App-Version, 1\.1\.0

        - id: cartelera-route
          order: 6
          uri: ${CARTELERA_URL:http://172.31.46.157:8081}
          predicates:
            - Path=/api/cartelera/**

        - id: asientos-route
          uri: ${ASIENTOS_URL:http://172.31.46.157:8082}
          predicates:
            - Path=/api/asientos/**

        # ---- Versionado de API (Examen Final): la versión se elige con el
        # header X-App-Version y el filtro VersionAuthorizationFilter valida
        # que el grupo del JWT coincida con esa versión. El orden hace que
        # primero se evalúen las rutas con header y, si no viene, se use la
        # ruta por defecto (versión vigente) ----
        - id: boletos-v1-route
          order: 1
          uri: ${BOLETOS_V1_URL:http://172.31.46.157:8093}
          predicates:
            - Path=/api/boletos/**
            - Header=X-App-Version, 1\.0\.0

        - id: boletos-v2-route
          order: 2
          uri: ${BOLETOS_V2_URL:http://172.31.46.157:8094}
          predicates:
            - Path=/api/boletos/**
            - Header=X-App-Version, 1\.1\.0

        # Por defecto: cuando NO viene el header va a la versión vigente
        - id: boletos-route
          order: 3
          uri: ${BOLETOS_URL:http://172.31.46.157:8083}
          predicates:
            - Path=/api/boletos/**

        # API de administración de Kafka (ms-notificaciones). El gateway exige
        # el grupo admin antes de reenviar; ms-notificaciones valida de nuevo.
        - id: notificaciones-route
          uri: ${NOTIFICACIONES_URL:http://172.31.46.157:8084}
          predicates:
            - Path=/api/admin/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

cognito:
  client-id: ${COGNITO_CLIENT_ID}
  issuer-uri: ${COGNITO_ISSUER_URI}

# Grupo de Cognito que puede usar /api/admin/** (lo lee SecurityConfig)
app:
  admin:
    group: admin

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: INFO
    com.ticketfilms.api_manager: DEBUG
